version: 1
project: smartcut
default_policy: deny

allow_prefixes:
  - ["npm", "run", "dev"]
  - ["npm", "run", "build"]
  - ["npm", "run", "lint"]
  - ["python3", "-m", "uvicorn"]
  - ["curl", "-sS", "http://localhost:"]
  - ["curl", "-sS", "http://127.0.0.1:"]
  - ["lsof", "-iTCP"]
  - ["ps", "-ef"]
  - ["tail", "-n"]

deny_prefixes:
  - ["rm"]
  - ["pkill"]
  - ["git", "reset", "--hard"]

notes:
  - "This file is governance only. Platform-level prompt suppression still depends on approved prefix_rule."
  - "Keep destructive commands out of allow_prefixes."
